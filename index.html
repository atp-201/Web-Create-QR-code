<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tạo QR Code Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Thư viện QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="app-bg"></div>

<div class="container glass">

  <div class="header">
    <h1>✨ QR Code Generator</h1>
    <p>Tạo QR nhanh</p>
  </div>

  <div class="card">

    <input id="textInput" type="text" placeholder="🔗 Nhập link hoặc nội dung">

    

    <div class="options">

      <div class="option">
        <label>Độ dày viền</label>
        <select id="borderSize">
          <option value="0">Không viền</option>
          <option value="4">4px</option>
          <option value="8">8px</option>
          <option value="12">12px</option>
        </select>
      </div>

      <div class="option">
        <label>Màu viền</label>
        <input type="color" id="borderColor" value="#4f46e5">
      </div>

      <div class="option">
        <label>Bo góc QR</label>
        <select id="radiusSelect">
          <option value="0">Vuông</option>
          <option value="12">Bo nhẹ</option>
          <option value="20">Bo nhiều</option>
        </select>
      </div>

      <div class="option">
        <label>Logo trung tâm</label>
        <input type="file" id="logoInput" accept="image/*">

        <div class="logo-actions">
          <button id="changeLogoBtn">Đổi</button>
          <button id="removeLogoBtn">Xóa</button>
        </div>

        <img id="logoPreview">
      </div>

    </div>

  </div>

  <div class="preview-card">
    <canvas id="previewCanvas"></canvas>
  </div>
  <button id="generateBtn" class="primary-btn">
      ⚡ Tạo QR ngay
  </button>

  <button id="downloadBtn" class="download-btn">
    ⬇️ Tải QR PNG
  </button>

</div>

<div id="qrcode" hidden></div>

<script src="script.js"></script>
</body>

</html>
